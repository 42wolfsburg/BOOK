version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: frontend:latest
    ports:
      - "5173:5173"
    volumes:
      - ./:/app:cached
      - /app/node_modules
    environment:
      - API_URL=${API_URL:-http://backend:3000}
    command: ["npm","run","dev","--","--host","0.0.0.0"]
